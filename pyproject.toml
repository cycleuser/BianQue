[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "juzi"
dynamic = ["version"]
description = "JuZi(巨子) - cross-platform hardware inspection & burn-in workflow: screen, camera, microphone, speaker, keyboard, mouse, thermal, battery, disk, memory, network"
readme = "README_CN.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "JuZi Contributors" },
]
keywords = [
    "hardware", "inspection", "burn-in", "screen", "dead-pixel",
    "camera", "microphone", "speaker", "keyboard", "thermal",
    "battery", "disk", "memory", "network", "benchmark", "gui",
    "pyside6", "验机", "巨子", "墨家",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Benchmark",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "PySide6>=6.4.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "pytest-timeout>=2.1.0",
    "mypy>=1.3.0",
    "ruff>=0.4.0",
]

[project.scripts]
juzi = "juzi.app:main"

[project.gui-scripts]
juzi-gui = "juzi.app:main"

[project.urls]
Homepage = "https://github.com/cycleuser/JuZi"
Repository = "https://github.com/cycleuser/JuZi"
Issues = "https://github.com/cycleuser/JuZi/issues"

[tool.setuptools.dynamic]
version = { attr = "juzi.__version__" }

[tool.setuptools.packages.find]
include = ["juzi*"]

[tool.setuptools.package-data]
juzi = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
strict_optional = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["juzi"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]
